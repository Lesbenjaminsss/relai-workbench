<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelAİ — Yönetim</title>
  <script>
    try {
      var t = localStorage.getItem('ai_theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { overflow: auto; }
    .topbar {
      height: 66px; border-bottom: 1px solid var(--line);
      background: var(--paper-2); display: flex; align-items: center;
      justify-content: space-between; padding: 0 clamp(20px, 5vw, 60px);
    }
    .topbrand { display: flex; align-items: center; gap: 11px; }
    .topbrand .mark { width: 30px; height: 30px; font-size: 18px; line-height: 30px; border-radius: 7px; }
    .topbrand b { font-family: var(--serif); font-size: 17px; font-weight: 500; }
    .topbrand small { font-size: 9px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin-left: 6px; }
    .back {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--muted); text-decoration: none;
      border: 1px solid var(--line); border-radius: 20px; padding: 7px 13px;
      background: var(--paper); transition: border-color .18s, color .18s;
    }
    .back:hover { border-color: var(--accent); color: var(--accent); }
    .back svg { width: 14px; height: 14px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    :root[data-theme="dark"] th { background: #242a23; }
    :root[data-theme="dark"] .table-wrap { box-shadow: none; }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 38px 22px 60px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .page-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: .18em; color: var(--accent); font-weight: 700; }
    h1 { font-family: var(--serif); font-size: 36px; font-weight: 500; letter-spacing: -.015em; margin: 8px 0 6px; }
    .sub { color: var(--muted); font-size: 13px; }
    .refresh {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 15px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--paper-2); color: var(--ink); font-size: 12px; font-weight: 600;
      transition: border-color .18s, transform .18s;
    }
    .refresh:hover { border-color: var(--accent); transform: translateY(-1px); }
    .refresh svg { width: 15px; height: 15px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 13px; margin-bottom: 34px; }
    .card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 3px 14px rgba(46,40,28,.04); }
    .card .n { font-family: var(--serif); font-size: 30px; color: var(--accent); line-height: 1; }
    .card .l { color: var(--muted); font-size: 11px; margin-top: 9px; text-transform: uppercase; letter-spacing: .1em; }

    h3 { font-family: var(--serif); font-size: 20px; font-weight: 500; margin: 0 0 12px; }
    .table-wrap { background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 34px; box-shadow: 0 3px 14px rgba(46,40,28,.04); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--line-soft); }
    th { color: var(--muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; background: #faf7f0; }
    tr:last-child td { border-bottom: none; }
    select { background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font-size: 12px; }
    .badge { padding: 4px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 600; background: #ece8df; color: var(--muted); text-transform: capitalize; }
    .badge.admin { background: var(--accent-pale); color: var(--accent-dk); }
    .badge.ok { background: rgba(109,135,104,.18); color: var(--sage); margin-left: 6px; }
    .footnote { font-family: var(--serif); font-style: italic; font-size: 12px; color: var(--muted); margin-top: 6px; }

    @media (max-width: 620px) {
      .topbrand small { display: none; }
      .page-head { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 30px; }
      table { font-size: 11px; }
      th, td { padding: 9px 10px; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbrand">
    <div class="mark">R<span>.</span></div>
    <b>RelAİ</b><small>yönetim</small>
  </div>
  <div class="top-actions">
    <button class="theme-toggle mini" type="button" title="Temayı değiştir">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-5-5 5 5 5"/></svg>
      Çalışma alanına dön
    </a>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <div>
      <div class="page-kicker">Sunucu defteri</div>
      <h1>Yönetim paneli</h1>
      <div class="sub">Kullanıcılar, etkinlikler ve genel durum bir arada.</div>
    </div>
    <button class="refresh" onclick="loadAll()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      Yenile
    </button>
  </div>

  <div id="cards" class="cards"></div>

  <h3>Kullanıcılar</h3>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Kullanıcı</th><th>E-posta</th><th>Rol</th><th>Durum</th><th>Kayıt</th><th>İşlem</th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>

  <h3>Son aktiviteler</h3>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Kullanıcı</th><th>İşlem</th><th>Detay</th><th>Zaman</th></tr></thead>
      <tbody id="logsBody"></tbody>
    </table>
  </div>
  <p class="footnote">Kayıtlar yalnızca bu sunucuda tutulur.</p>
</div>

<script src="/static/admin.js"></script>
</body>
</html>
